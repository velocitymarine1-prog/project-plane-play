<title>Project Plane</title>

<style>
  /* PROJECT PLANE · the six levels. The frame is the kit's; the lettering is DOM on top of it (the style book's rules). */
  :root { --ink:#30210a; --paper:#fdf8ee; --stock:#fff1d6; --accent:#ef4c95; --cap:#ffd23f; --cyan:#2bb3e6; --cobalt:#2f5fd0; --bg:#e9f4f8; --lock:#c9bfae; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); color-scheme: light; }
  html, body { height: 100%; }

  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; background: var(--bg); }
  canvas#c:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui button { font: 400 16px/1 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .05em; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 7px 9px; cursor: pointer; touch-action: manipulation; pointer-events: auto; }
  #ui button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #ui button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .slot { position: absolute; left: 24px; top: calc(24px + var(--sat)); font-variant-numeric: tabular-nums; pointer-events: none; }
  .slot.rest { font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; background: var(--paper); border: 2px solid var(--ink); padding: 5px 8px; color: var(--ink); }
  .slot.flight { font: 400 40px/1 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; color: var(--accent); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink); }
  #pauseBtn { position: absolute; right: 26px; top: calc(20px + var(--sat)); width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 15px; }
  .cashTag { position: absolute; left: 50%; bottom: calc(210px + var(--sab)); transform: translateX(-50%); font: 400 22px/1 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 4px 10px; font-variant-numeric: tabular-nums; transition: opacity .2s; }
  .cashTag.off { opacity: 0; }
  .c3d-cap, .c3d-name, .c3d-count, .c3d-panel { display: none !important; }
  .cards { position: absolute; left: 50%; bottom: calc(40px + var(--sab)); transform: translateX(-50%); display: flex; gap: 10px; width: min(560px, calc(100vw - 32px)); justify-content: center; transition: transform .28s cubic-bezier(.4,0,.2,1), opacity .2s; pointer-events: auto; }
  .cards.off { transform: translate(-50%, 160%); opacity: 0; pointer-events: none; }
  .card { flex: 1 1 0; min-width: 0; text-align: left; display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'title title' 'num num' 'unlock price'; gap: 3px 6px; align-items: end; padding: 8px 8px 6px !important; background: var(--paper); position: relative; }
  .card b { grid-area: title; } .card .num { grid-area: num; } .card .unlock { grid-area: unlock; } .card .price { grid-area: price; }
  .card b { font: 400 17px/1 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; display: block; white-space: nowrap; overflow: hidden; }
  .card b i { font-style: normal; color: var(--accent); -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
  .card .num { font: 700 11px/1.2 ui-monospace, Menlo, monospace; letter-spacing: 0; white-space: nowrap; }
  .card .unlock { font: 700 10px/1.2 "Comic Neue", "Trebuchet MS", Arial, sans-serif; color: #6b5d4a; align-self: center; }
  .card .price { position: relative; width: 58px; height: 58px; display: grid; place-items: center; }
  .card .price svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--cap); stroke: var(--ink); stroke-width: 3; filter: drop-shadow(2px 2px 0 var(--ink)); }
  .card .price span { position: relative; font: 400 13px/1 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .03em; }
  .card.cant { background: #e6dccb; color: #6b5d4a; } .card.cant .price svg { fill: var(--lock); } .card.cant b i { color: #a09480; }
  .card.can:active .price svg { fill: var(--accent); } .card.can:active .price span { color: var(--paper); }
  .card.maxed .price svg { fill: var(--cobalt); } .card.maxed .price span { color: var(--paper); }
  .panel { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(-1.5deg); background: var(--cap); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 14px 20px; text-align: center; max-width: min(84vw, 460px); pointer-events: auto; }
  .panel b { display: block; font: 400 30px/1.05 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; margin-bottom: 6px; }
  .panel .line { display: block; font: 700 13px/1.35 "Comic Neue", "Trebuchet MS", Arial, sans-serif; text-transform: uppercase; letter-spacing: .04em; }
  .panel .first { color: var(--cobalt); } .panel .rec { color: var(--accent); -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; font-family: Bangers, Impact, sans-serif; font-size: 20px; font-weight: 400; }
  .panel .tap { margin-top: 8px; font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; opacity: .8; display: block; }
  .panel .next { display: inline-block; margin: 10px 0 2px; background: var(--accent); color: var(--paper); -webkit-text-stroke: 0; }
  .hint { position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%) rotate(1deg); background: var(--paper); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 12px 16px; text-align: center; font: 700 12px/1.4 "Comic Neue", "Trebuchet MS", Arial, sans-serif; text-transform: uppercase; letter-spacing: .05em; max-width: 78vw; }
  .hint b { display: block; font: 400 22px/1.05 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; margin-bottom: 4px; }
  .hint .folio, .title .folio { display: inline-block; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); border: 2px solid var(--ink); color: var(--paper); font: 400 18px/26px Bangers, Impact, sans-serif; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; margin-top: 6px; }
  /* the title card of a level (pass 7): its number, its name, its tagline, the roundel; a tap or 1.8 s takes it away */
  .title { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-1deg); background: var(--stock); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 16px 22px 14px; text-align: center; width: min(78vw, 420px); pointer-events: auto; }
  .title .n, .lvl .n { display: block; font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: #6b5d4a; }
  .title b { display: block; font: 400 clamp(30px, 9vw, 44px)/1.02 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; margin: 6px 0 8px; color: var(--accent); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); text-wrap: balance; }
  .title .tag, .lvl .tag { display: block; font: 700 12px/1.4 "Comic Neue", "Trebuchet MS", Arial, sans-serif; letter-spacing: .02em; }
  /* the level select (pass 7): six stock cards in a strip that scrolls sideways with snap */
  .levels { position: absolute; inset: 0; background: rgba(48, 33, 10, .6); display: grid; place-items: center; pointer-events: auto; }
  .levels .box { background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 16px 0 14px; width: min(94vw, 720px); display: flex; flex-direction: column; gap: 12px; }
  .levels h2 { margin: 0 20px; font: 400 32px/1 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; }
  .levels .row { display: flex; gap: 8px; margin: 0 20px; } .levels .row button { flex: 1 1 auto; }
  .levels p { margin: 0 20px; font: 700 11px/1.45 ui-monospace, Menlo, monospace; letter-spacing: .03em; color: #6b5d4a; }
  .strip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 20px 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .lvl { flex: 0 0 200px; scroll-snap-align: center; text-align: left !important; display: flex; flex-direction: column; gap: 6px; padding: 12px 12px 10px !important; background: var(--stock) !important; min-height: 150px; }
  .lvl b { font: 400 22px/1.02 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; text-wrap: balance; }
  .lvl .tag { flex: 1 1 auto; font-size: 11px; color: #6b5d4a; }
  .lvl .st { font: 700 10px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .06em; color: var(--cobalt); }
  .lvl.locked { background: #e6dccb !important; color: #6b5d4a; box-shadow: 2px 2px 0 var(--lock) !important; border-color: var(--lock) !important; } .lvl.locked .st { color: #a09480; }
  .lvl.done .st { color: var(--accent); }
  .lvl.current { border-color: var(--accent) !important; box-shadow: 3px 3px 0 var(--accent) !important; }
  .lvl.shake { animation: shake .35s; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .pauseMenu { position: absolute; inset: 0; background: rgba(48, 33, 10, .55); display: grid; place-items: center; pointer-events: auto; }
  .pauseMenu .box { background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 18px 20px; width: min(86vw, 380px); display: flex; flex-direction: column; gap: 10px; }
  .pauseMenu h2 { margin: 0 0 4px; font: 400 32px/1 Bangers, Impact, "Arial Black", sans-serif; letter-spacing: .04em; }
  .pauseMenu .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pauseMenu .row button { flex: 1 1 auto; }
  .pauseMenu p { margin: 0; font: 700 11px/1.45 ui-monospace, Menlo, monospace; letter-spacing: .03em; color: #6b5d4a; }
  .pauseMenu .note { color: var(--cobalt); }
  .hold { position: relative; overflow: hidden; } .hold i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--accent); opacity: .5; }
  .hold.armed { background: var(--accent); color: var(--paper); }
  .hide #ui, .hide .c3d-root { display: none; }
  .cashTag.off, .cards.off { pointer-events: none; }
  @media (max-width: 600px) { #ui button { font-size: 14px; padding: 6px 8px; } .slot.flight { font-size: 30px; } #pauseBtn { top: calc(16px + var(--sat)); width: 36px; height: 36px; } .card b { font-size: 15px; } .card .price { width: 50px; height: 50px; } .card .price span { font-size: 11px; } .panel b { font-size: 24px; } .cashTag { font-size: 18px; bottom: calc(190px + var(--sab)); } .lvl { flex-basis: 176px; } }
  @media (max-height: 640px) { .cards { bottom: calc(30px + var(--sab)); } .cashTag { bottom: calc(170px + var(--sab)); } }
  @media (prefers-reduced-motion: reduce) { .cards, .cashTag { transition: none; } .lvl.shake { animation: none; } .strip { scroll-behavior: auto; } }
  body.shot .cards, body.shot .cashTag, body.shot .c3d-sfx, body.shot .lvl { transition: none; animation: none; }   /* proof frames: nothing in motion in the DOM */
</style>

<body>
<canvas id="c" tabindex="0" aria-label="Project Plane: throw a paper plane through a comic-book house. Drag the plane back and swipe forward to throw; arrow keys aim, 1 to 5 pick the loft, Space throws."></canvas>
<div id="ui">
  <div class="slot rest" id="slot"></div>
  <button type="button" id="pauseBtn" aria-label="Pause" aria-expanded="false">II</button>
  <div class="cashTag off" id="cashTag">$0</div>
  <div class="cards off" id="cards"></div>
  <div class="panel" id="panel" hidden></div>
  <div class="hint" id="hint" hidden><b>DRAG THE PLANE BACK</b>then swipe forward to throw<br><span class="folio">1</span></div>
  <div class="title" id="title" hidden></div>
  <div class="levels" id="levels" hidden><div class="box" role="dialog" aria-label="The levels"><h2>THE LEVELS</h2>
    <div class="strip" id="levelStrip"></div>
    <div class="row"><button type="button" id="levelsClose">CLOSE</button></div>
    <p>A level is a fresh run of the same three cards. ALLOWANCE carries. Finish a level to open the next.</p>
  </div></div>
  <div class="pauseMenu" id="pause" hidden><div class="box" role="dialog" aria-label="Paused"><h2>PAUSED</h2>
    <div class="row"><button type="button" id="resumeBtn">RESUME</button><button type="button" id="twosBtn">ON TWOS</button><button type="button" id="levelsBtn">LEVELS</button></div>
    <div class="row"><button type="button" id="resetBtn" class="hold" aria-label="Reset this level: hold for two seconds"><i></i>RESET THIS LEVEL · HOLD 2 S</button></div>
    <div class="row"><button type="button" id="resetAllBtn" class="hold" aria-label="Reset everything: hold for two seconds, twice"><i></i>RESET EVERYTHING · HOLD 2 S</button></div>
    <p id="fps">…</p><p id="storageNote" class="note" hidden></p>
    <p id="pauseInfo">PROJECT PLANE · keys: ← → yaw · ↑ ↓ power · Q E step · 1–5 loft · space throws · R retries · T twos · H hides · P pauses</p>
  </div></div>
</div>
<script type="module" src="game/main.js"></script>
<script>
  /* if the modules never arrive (Three.js from the CDN, or a file), say so instead of a blank page */
  setTimeout(function () { if (!window.__plane && !/^ERR/.test(document.title)) { var m = document.createElement('div'); m.className = 'panel'; m.innerHTML = '<b>THE PAGE DID NOT LOAD</b><span class="line">Three.js from jsdelivr or one of the game\'s files did not arrive. Check the connection and reload.</span>'; document.getElementById('ui').appendChild(m); } }, 12000);
</script>
</body>
</html>
